<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-U App - Bienvenida</title>
    <link rel="icon" type="image/png" href="assets/images/LOGONET-U_tr_05.png">
    <style>
        :root {
            --rbuu-blue: #2563EB;
            --rbuu-light: #EFF6FF;
            --text-main: #0F172A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--rbuu-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        /* 1. CONTENEDOR PRINCIPAL FLUIDO (100% en todos los dispositivos) */
        .mobile-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #FFFFFF, var(--rbuu-light));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 2. SISTEMA DE PARTÍCULAS */
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-item {
            position: absolute;
            bottom: -10%;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        /* 3. CAPA DE INTERFAZ (Logo, eslogan y botón) */
        .ui-layer {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #FFFFFF;
            color: var(--rbuu-blue);
            border: 2px solid #E2E8F0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 3;
        }

        .logo-animado {
            width: 220px;
            max-width: 70%;
            height: auto;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .slogan {
            color: var(--rbuu-blue);
            font-size: 15px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 40px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.5s;
        }

        .btn-entrar {
            background-color: var(--rbuu-blue);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 1s, pulseBtn 2s infinite 1.5s;
        }

        /* ANIMACIONES */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes pulseBtn {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 20px rgba(37, 99, 235, 0.6);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            }
        }

        /* 4. RESPONSIVIDAD PARA PC Y TABLET (Media Queries) */
        @media (min-width: 768px) {
            .logo-animado {
                width: 320px; /* Hace el logo más grande en monitores */
            }

            .slogan {
                font-size: 20px; /* Texto más grande para lectura en PC */
                margin-top: 30px;
                margin-bottom: 50px;
            }

            .lang-switch {
                top: 40px;
                right: 40px; /* Botón de idioma con más margen */
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
    <script>
        if (sessionStorage.getItem('introVista')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <div class="mobile-container">
        <!-- Fondo de partículas -->
        <div id="particles-container"></div>

        <button id="btn-traduccion" class="lang-switch" data-i18n="btn_lang">ES / EN</button>

        <!-- Capa de interfaz -->
        <div class="ui-layer">
            <img src="assets/images/LOGONET-U_tr_04.png" alt="Net-U Logo" class="logo-animado">
            <p class="slogan" data-i18n="intro_slogan">Tu espacio de bienestar y organización universitaria</p>
            <button class="btn-entrar" onclick="marcarVisto()" data-i18n="intro_entrar">COMENZAR</button>
        </div>
    </div>

    <script src="traduccion.js"></script>
    <script>
        function marcarVisto() {
            sessionStorage.setItem('introVista', 'true');
            window.location.href = 'index.html';
        }

        // Generador de animaciones escolares
        function crearParticulas() {
            const container = document.getElementById('particles-container');
            // Iconos relacionados al bienestar universitario, multimedia y estudio
            const iconos = ['📚', '🎓', '💡', '💻', '✏️', '🧠', '✨', '🎯'];
            const cantidad = 15; // Número de elementos flotando al mismo tiempo

            for (let i = 0; i < cantidad; i++) {
                let particula = document.createElement('div');
                particula.className = 'floating-item';
                particula.innerText = iconos[Math.floor(Math.random() * iconos.length)];

                // Posición horizontal aleatoria
                particula.style.left = Math.random() * 90 + 5 + '%';

                // Tamaño aleatorio para dar profundidad (entre 15px y 35px)
                particula.style.fontSize = Math.floor(Math.random() * 20 + 15) + 'px';

                // Velocidad aleatoria (entre 6s y 12s)
                particula.style.animationDuration = Math.random() * 6 + 6 + 's';

                // Retraso aleatorio para que no salgan todos al mismo tiempo
                particula.style.animationDelay = Math.random() * 5 + 's';

                // Opacidad aleatoria para un efecto más sutil
                particula.style.filter = `opacity(${Math.random() * 0.5 + 0.2})`;

                container.appendChild(particula);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            crearParticulas();

            // Aumentamos el tiempo de espera a 8 segundos antes del salto automático
            // para que el usuario pueda ver la animación y darle clic al botón "Comenzar"
            setTimeout(() => {
                marcarVisto();
            }, 8000);
        });
    </script>
</body>
</html>
