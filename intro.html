<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-U App - Bienvenida</title>
    <style>
        :root {
            --rbuu-blue: #2563EB;
            --text-main: #0F172A;
            --bg-app: #F8FAFC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Animación CSS para el logo */
        .logo-animado {
            width: 220px;
            max-width: 80%;
            height: auto;
            margin-bottom: 40px;
            animation: fadeInPulse 2.5s ease-out forwards;
        }

        @keyframes fadeInPulse {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-entrar {
            background-color: var(--rbuu-blue);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            opacity: 0;
            animation: showBtn 1s ease forwards 1.5s; /* Aparece después del logo */
        }

        @keyframes showBtn {
            to {
                opacity: 1;
            }
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #E2E8F0;
            color: var(--rbuu-blue);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="btn-traduccion" class="lang-switch" data-i18n="btn_lang">ES / EN</button>

    <div class="splash-container">
        <!-- Reemplaza con la ruta de tu logo -->
        <img src="assets/images/LOGONET-U_tr_05.png" alt="Net-U Logo" class="logo-animado">
        <button class="btn-entrar" onclick="window.location.href='index.html'" data-i18n="intro_entrar">COMENZAR</button>
    </div>

    <script src="traduccion.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirección automática después de 4.5 segundos
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 4500);
        });
    </script>
</body>
</html>
